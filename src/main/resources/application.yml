server:
  port: 8003

spring:
  application:
    name: report-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/crash2cost
      auto-index-creation: true

logging:
  file:
    name: logs/report-service.log
    path: logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.mrlevi1112: DEBUG

jwt:
  secret: ${JWT_SECRET:change_me_in_production_but_use_env_var}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8002}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8004}

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
