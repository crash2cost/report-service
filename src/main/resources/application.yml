server:
  port: 8003

spring:
  application:
    name: report-service

logging:
  file:
    name: logs/report-service.log
    path: logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.mrlevi1112: DEBUG
  data:
    mongodb:
      uri: mongodb://localhost:27017/crash_reports
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8002}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8004}
